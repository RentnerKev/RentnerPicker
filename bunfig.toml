[install]
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = ["@rentnerkev/picker"]
linker = "isolated"
globalStore = false
[test]
root = "src/tests"
pathIgnorePatterns = ["**/*.db.test.ts", "**/*.spec.ts", "**/types/**"]
preload = ["./src/tests/setup.ts"]

# The empty .oxfmtrc.json preserves Bun's Oxfmt output mode.
[fmt]
semi = false
singleQuote = true
trailingComma = "all"
tabWidth = 4
useTabs = false
printWidth = 80
sortPackageJson = false
ignorePatterns = [
    "dist/",
    "build/",
    "node_modules/",
    "bun.lock",
    "**/drizzle/**",
    "**/.env",
    "**/.env.*",
    "**/routeTree.gen.*",
    "**/*.generated.*",
    "test-results/**",
    "playwright-report/**",
    "coverage/**",
    "**/target/**",
]
